name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm 11.1.2
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run core tests
        run: pnpm test
      - name: Enforce core coverage
        run: pnpm test:coverage
      - name: Lint
        run: pnpm lint
      - name: Build production application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Run production HTTP smoke
        run: pnpm verify:http
      - name: Upload Playwright report
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright test results
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy-production:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://aprendeconjesusdev.vercel.app
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: https://aprendeconjesusdev.vercel.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Enable pnpm 11.1.2
        run: corepack enable && corepack prepare pnpm@11.1.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done
      - name: Pull Vercel production configuration
        run: pnpm dlx vercel@59.1.3 pull --yes --environment=production
      - name: Build Vercel production artifacts
        run: pnpm dlx vercel@59.1.3 build --prod
      - name: Deploy prebuilt production artifacts
        id: deploy
        shell: bash
        run: |
          deployment_output="$(pnpm dlx vercel@59.1.3 deploy --prebuilt --prod --meta "githubCommitSha=$GITHUB_SHA")"
          deployment_url="$(printf '%s\n' "$deployment_output" | grep -Eo 'https://[^[:space:]]+' | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "::error::Vercel did not return a valid HTTPS deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Run production HTTP smoke
        run: SMOKE_BASE_URL="$PRODUCTION_URL" pnpm verify:http
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production browser smoke
        env:
          PLAYWRIGHT_PRODUCTION: "1"
          PLAYWRIGHT_BASE_URL: ${{ env.PRODUCTION_URL }}
        run: pnpm test:e2e
      - name: Upload production Playwright report
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: production-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload production Playwright test results
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: production-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
